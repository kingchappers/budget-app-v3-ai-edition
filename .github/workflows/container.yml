name: Container image

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
    tags: [ "v[0-9]+.[0-9]+.[0-9]+*" ]

permissions:
  contents: read

# Superseded pull request runs are cancelled; main and tag publish runs never are.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/kingchappers/budget-app-v3-ai-edition

jobs:
  smoke:
    name: Build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - name: Build (linux/amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: budget-app:ci
          build-args: DEBIAN_UPDATES_STAMP=${{ github.run_id }}
          cache-from: type=gha,scope=container-smoke
          cache-to: type=gha,scope=container-smoke,mode=max
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 24.x
      - name: Smoke test (plain HTTP)
        run: node scripts/container-smoke.mjs budget-app:ci
      - name: Smoke test (built-in HTTPS on localhost)
        run: node scripts/container-smoke.mjs budget-app:ci --tls
      - name: Smoke test (plain HTTP behind a TLS-terminating proxy)
        run: node scripts/container-smoke.mjs budget-app:ci --proxy
      - name: Scan for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: budget-app:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore

  publish:
    name: Publish to GHCR
    # Pull requests (including forks) never reach this job.
    if: github.event_name == 'push'
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # A push to main gives only edge. A release tag vX.Y.Z gives X.Y.Z, X.Y and latest.
          # A pre-release tag (one with a hyphen, such as v1.0.0-rc1) gives only its full version.
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
          flavor: |
            latest=false
          # Keep these in step with the Dockerfile labels.
          labels: |
            org.opencontainers.image.title=Budget app
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.source=https://github.com/kingchappers/budget-app-v3-ai-edition
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          build-args: DEBIAN_UPDATES_STAMP=${{ github.run_id }}
          cache-from: type=gha,scope=container-publish
          cache-to: type=gha,scope=container-publish,mode=max

openapi: 3.1.0
info:
  title: Hoardwise API
  version: 1.0.0
  description: |
    The Hoardwise budget API. Every route is under `/api` and speaks JSON.

    ## Amounts, dates and months

    - Amounts are integers in the smallest currency unit (pence or cents), never decimals. A transaction, target,
      pot or recurring amount is positive and at most 1,000,000,000. Account balances are sent as `pence`.
    - Dates are `YYYY-MM-DD`, months are `YYYY-MM` and timestamps are ISO 8601.

    ## Glossary

    - Transaction `type`: `EXPENSE` is Spend, `INCOME` is Income, `SET_ASIDE` is Add to pot and `TAKE_OUT` is
      Take from pot.
    - A budget is a category target.
    - A pot is a category whose balance carries over from month to month.

    ## Authentication

    There are two ways to authenticate, and every operation accepts either unless its `x-token-access` says otherwise.

    - A browser session: the Auth0 JWT as a Bearer token (Auth0 mode), or the session cookie set by the built-in
      login (local mode). Cookie-authenticated requests that change data must send an `Origin` header matching the
      host.
    - A personal API token, created on the Access tokens page or with `POST /api/tokens`, sent as
      `Authorization: Bearer <token>`. A read token starts `hwr_` and a read-write token starts `hww_`. Examples in this
      document use placeholders such as `hwr_EXAMPLE`; never paste a real token into shared text.

    Token rules:

    - A read token may only make `GET` and `HEAD` requests. Any other method returns 403 `This token is read-only`.
      A read-write token may use every method.
    - A token can never reach `/api/tokens*`, `/api/push*` or `/api/auth/*`; those return 403
      `Not available to access tokens`. Each operation records this as `x-token-access`: `none` (no token),
      `read` (a read token is enough) or `write` (a read-write token is needed).
    - A token is shown once when it is created, expires when its owner chose, can be revoked, and is revoked for
      good by a password reset.
    - Repeated failed token lookups from one client address are rate limited and answered with 429 and a
      `Retry-After` header. The limit is exact in the self-hosted container and best-effort per instance on AWS.

    `/api/auth/*` (login, logout, setup and recovery for the built-in login) is not described here.

    ## Errors

    An error response has a JSON body `{ "error": "<message>" }`, and some add extra fields. The statuses are 400
    (invalid input), 401 (missing or invalid credential), 403 (forbidden, including token limits and protected
    default categories), 404 (unknown route or record), 409 (conflict with the current state), 429 (too many
    requests; see `Retry-After`) and 500 (an unexpected server failure, with a generic message).

    ## HEAD

    `HEAD` is not served. The router matches the request method exactly and registers no `HEAD` handlers, so a `HEAD`
    request to a `GET` route returns 404 `Endpoint not found`. A read token is nonetheless allowed to pass the token
    check with `HEAD`; use `GET` to read.
servers:
  - url: /
    description: The same origin that serves the app.
tags:
  - name: categories
    description: Spending and income categories, including pot categories.
  - name: transactions
    description: Spend, income and pot movements.
  - name: targets
    description: Monthly budgets, one per category.
  - name: pots
    description: Pot settings, balances and archiving.
  - name: recurring
    description: Reminders for bills and income that repeat.
  - name: accounts
    description: Savings, investments and debts, with a balance history.
  - name: trash
    description: Deleted items that can be restored.
  - name: push
    description: Web push reminder subscriptions. Not available to access tokens.
  - name: tokens
    description: Personal API token management. Not available to access tokens.
security:
  - bearerToken: []
  - sessionCookie: []
paths:
  /api/categories:
    get:
      tags: [categories]
      summary: List categories
      description: >-
        Returns the 21 built-in default categories followed by the household's custom categories (in id order). A pot
        category that has been archived carries `archived: true`; other categories omit the field.
      operationId: listCategories
      x-token-access: read
      responses:
        '200':
          description: The default and custom categories.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [categories]
                properties:
                  categories:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
              example:
                categories:
                  - categoryId: cat-groceries
                    name: Groceries
                    type: EXPENSE
                    icon: 🛒
                    group: EVERYDAY
                    isDefault: true
                    createdAt: '2026-01-01T00:00:00.000Z'
                  - categoryId: cat-salary
                    name: Salary
                    type: INCOME
                    icon: briefcase
                    isDefault: true
                    createdAt: '2026-01-01T00:00:00.000Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [categories]
      summary: Create a custom category
      description: >-
        Creates a category with a server-generated UUID id. When `group` is omitted it defaults to `SINKING_FUNDS` for
        a `POT`, nothing for `INCOME` and `EVERYDAY` for an `EXPENSE`. `name` is trimmed before it is stored.
      operationId: createCategory
      x-token-access: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
            examples:
              expense:
                summary: A bills category
                value:
                  name: Gym membership
                  type: EXPENSE
                  icon: 🏋️
                  group: BILLS
              pot:
                summary: A pot with the default group
                value:
                  name: New bike
                  type: POT
      responses:
        '201':
          description: The category was created.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [category]
                properties:
                  category:
                    $ref: '#/components/schemas/Category'
              example:
                category:
                  categoryId: 3f0c1a52-6d1e-4c53-9a3e-0a2d6a4f8b11
                  name: Gym membership
                  type: EXPENSE
                  icon: 🏋️
                  group: BILLS
                  isDefault: false
                  createdAt: '2026-10-30T09:15:00.000Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/categories/{categoryId}:
    parameters:
      - $ref: '#/components/parameters/categoryId'
    put:
      tags: [categories]
      summary: Rename a custom category
      description: >-
        Only the name can change. Default categories (ids starting `cat-` that ship with the app) cannot be renamed.
        The `categoryId` must be a custom category, for example the id returned by `createCategory`.
      operationId: renameCategory
      x-token-access: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRenameInput'
            example:
              name: Fitness
      responses:
        '200':
          description: The renamed category.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [category]
                properties:
                  category:
                    $ref: '#/components/schemas/Category'
              example:
                category:
                  categoryId: 3f0c1a52-6d1e-4c53-9a3e-0a2d6a4f8b11
                  name: Fitness
                  type: EXPENSE
                  icon: 🏋️
                  group: BILLS
                  isDefault: false
                  createdAt: '2026-10-30T09:15:00.000Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: A default category cannot be renamed (`Cannot rename a default category`), or the credential may not make this request (see the shared `Forbidden` response).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Cannot rename a default category
        '404':
          description: No custom category has this id (`Category not found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Category not found
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [categories]
      summary: Delete a custom category
      description: >-
        Removes the category for good (it is not moved to the trash). Transactions and reminders that use it are not
        changed; use `reassignCategory` first to move them. Deleting an id that does not exist still returns 204.
        Default categories cannot be deleted.
      operationId: deleteCategory
      x-token-access: write
      responses:
        '204':
          description: The category is gone. No body.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: A default category cannot be deleted (`Cannot delete a default category`), or the credential may not make this request (see the shared `Forbidden` response).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Cannot delete a default category
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/categories/{categoryId}/reassign:
    parameters:
      - $ref: '#/components/parameters/categoryId'
    post:
      tags: [categories]
      summary: Move a category's transactions and reminders to another category
      description: >-
        Re-points every transaction and recurring reminder that uses `categoryId` at `toCategoryId`. The source id is
        not checked, so an id with no records returns zero counts. The destination must be a default category or an
        existing custom category.
      operationId: reassignCategory
      x-token-access: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReassignInput'
            example:
              toCategoryId: cat-groceries
      responses:
        '200':
          description: How many records were moved.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [reassigned, recurringReassigned]
                properties:
                  reassigned:
                    type: integer
                    minimum: 0
                    description: Transactions moved.
                  recurringReassigned:
                    type: integer
                    minimum: 0
                    description: Recurring reminders moved.
              example:
                reassigned: 3
                recurringReassigned: 1
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/targets:
    get:
      tags: [targets]
      summary: List budgets
      description: >-
        Returns every category target. Unlike the single-target response, each item also carries the storage keys
        `PK` and `SK` (`USER#<id>` and `TARGET#<categoryId>`).
      operationId: listTargets
      x-token-access: read
      responses:
        '200':
          description: All targets.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [targets]
                properties:
                  targets:
                    type: array
                    items:
                      $ref: '#/components/schemas/StoredTarget'
              example:
                targets:
                  - PK: USER#user-1
                    SK: TARGET#cat-groceries
                    categoryId: cat-groceries
                    targetAmount: 30000
                    period: MONTHLY
                    updatedAt: '2026-10-30T09:15:00.000Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/targets/{categoryId}:
    parameters:
      - $ref: '#/components/parameters/categoryId'
    put:
      tags: [targets]
      summary: Set a category's budget
      description: >-
        Creates or replaces the target for the category. The category id is not checked against the household's
        categories, so any id is accepted.
      operationId: putTarget
      x-token-access: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TargetInput'
            example:
              targetAmount: 30000
              period: MONTHLY
      responses:
        '200':
          description: The stored target.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [target]
                properties:
                  target:
                    $ref: '#/components/schemas/Target'
              example:
                target:
                  categoryId: cat-groceries
                  targetAmount: 30000
                  period: MONTHLY
                  updatedAt: '2026-10-30T09:15:00.000Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [targets]
      summary: Remove a category's budget
      description: >-
        Moves the target to the trash, where it can be restored. Removing a target that does not exist still returns
        204.
      operationId: deleteTarget
      x-token-access: write
      responses:
        '204':
          description: The target is removed. No body.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/transactions:
    get:
      tags: [transactions]
      summary: List a month's transactions
      description: >-
        Returns every transaction stored under the given month, as raw stored records that include the storage keys
        `PK` and `SK` (`USER#<id>` and `TXN#<yearMonth>#<transactionId>`). `month` is zero-padded, so `3` and `03` both
        mean March. The values are parsed leniently: the handler only checks that both parse as integers, with `month`
        1 to 12 and `year` at least 2000. A `year` or `month` with trailing characters (such as `2026x`) passes the check
        and is used as given, so it matches nothing and returns an empty list. A transaction belongs to the month in its
        `yearMonth` field, which is the first 7 characters of its `date`.
      operationId: listTransactions
      x-token-access: read
      parameters:
        - name: year
          in: query
          required: true
          description: The four-digit year, 2000 or later.
          schema:
            type: integer
            minimum: 2000
          example: 2026
        - name: month
          in: query
          required: true
          description: The month number, 1 to 12.
          schema:
            type: integer
            minimum: 1
            maximum: 12
          example: 10
      responses:
        '200':
          description: The month's transactions (an empty list when there are none).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [transactions]
                properties:
                  transactions:
                    type: array
                    items:
                      $ref: '#/components/schemas/StoredTransaction'
              example:
                transactions:
                  - PK: USER#user-1
                    SK: TXN#2026-10#6f1d2c8e-3b4a-4c5d-8e9f-0a1b2c3d4e5f
                    transactionId: 6f1d2c8e-3b4a-4c5d-8e9f-0a1b2c3d4e5f
                    yearMonth: '2026-10'
                    amount: 1250
                    type: EXPENSE
                    categoryId: cat-groceries
                    description: Weekly shop
                    date: '2026-10-29'
                    createdAt: '2026-10-29T18:30:00.000Z'
        '400':
          description: '`year` or `month` is missing (`year and month query parameters are required`) or out of range (`Invalid year or month`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: year and month query parameters are required
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [transactions]
      summary: Add a transaction
      description: >-
        Stores a transaction in the month given by the first 7 characters of `date`. The server sets `yearMonth` and
        `createdAt`. The id is a server-generated UUID unless the client supplies `transactionId`, which lets a client
        retry safely; supplying an id that already exists in that month silently replaces that transaction. The
        `categoryId` and `recurringId` are not checked against existing records. `date` is checked by shape only, so
        `2026-13-45` is accepted. `description` may be omitted or null and is stored as an empty string. Unknown fields
        are ignored. A body that is valid JSON but not an object (for example `null`) returns 500, not 400.
      operationId: createTransaction
      x-token-access: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionInput'
            examples:
              expense:
                summary: A grocery shop
                value:
                  transactionId: 6f1d2c8e-3b4a-4c5d-8e9f-0a1b2c3d4e5f
                  amount: 1250
                  type: EXPENSE
                  categoryId: cat-groceries
                  description: Weekly shop
                  date: '2026-10-29'
              income:
                summary: Salary, with the id left to the server
                value:
                  amount: 250000
                  type: INCOME
                  categoryId: cat-salary
                  date: '2026-10-28'
      responses:
        '201':
          description: The transaction was stored.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [transaction]
                properties:
                  transaction:
                    $ref: '#/components/schemas/Transaction'
              example:
                transaction:
                  transactionId: 6f1d2c8e-3b4a-4c5d-8e9f-0a1b2c3d4e5f
                  yearMonth: '2026-10'
                  amount: 1250
                  type: EXPENSE
                  categoryId: cat-groceries
                  description: Weekly shop
                  date: '2026-10-29'
                  createdAt: '2026-10-29T18:30:00.000Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/transactions/range:
    get:
      tags: [transactions]
      summary: List transactions across several months
      description: >-
        Returns the raw stored records (with `PK` and `SK`, as in `listTransactions`) whose `yearMonth` falls from
        `from` to `to` inclusive. The range is at most 24 months. Months are compared as `YYYY-MM` strings.
      operationId: listTransactionsRange
      x-token-access: read
      parameters:
        - name: from
          in: query
          required: true
          description: The first month, as `YYYY-MM`.
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          example: '2026-08'
        - name: to
          in: query
          required: true
          description: The last month, as `YYYY-MM`. Must not be before `from`, and at most 24 months from it inclusive.
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          example: '2026-10'
      responses:
        '200':
          description: The transactions in the range (an empty list when there are none).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [transactions]
                properties:
                  transactions:
                    type: array
                    items:
                      $ref: '#/components/schemas/StoredTransaction'
              example:
                transactions:
                  - PK: USER#user-1
                    SK: TXN#2026-10#6f1d2c8e-3b4a-4c5d-8e9f-0a1b2c3d4e5f
                    transactionId: 6f1d2c8e-3b4a-4c5d-8e9f-0a1b2c3d4e5f
                    yearMonth: '2026-10'
                    amount: 1250
                    type: EXPENSE
                    categoryId: cat-groceries
                    description: Weekly shop
                    date: '2026-10-29'
                    createdAt: '2026-10-29T18:30:00.000Z'
        '400':
          description: >-
            `from` or `to` is missing or not a month (`from and to must be months in YYYY-MM format`), `from` is after
            `to` (`from must not be after to`), or the range is over 24 months (`the range must be at most 24 months`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: from must not be after to
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/transactions/{yearMonth}/{transactionId}:
    parameters:
      - $ref: '#/components/parameters/yearMonth'
      - $ref: '#/components/parameters/transactionId'
    put:
      tags: [transactions]
      summary: Replace a transaction
      description: >-
        Replaces every field of an existing transaction; the body is the same as for `createTransaction` (a
        `transactionId` in the body is ignored, the path id is kept). The path `yearMonth` is where the transaction is
        found. If the new `date` is in a different month, the transaction is moved there in one step: it keeps its id and
        `createdAt`, and the response carries the new `yearMonth`, so the old `yearMonth/transactionId` path stops
        working. `recurringId` keeps its stored value when omitted and cannot be cleared. The path month is checked by
        shape only (`YYYY-MM`, so `2026-13` is accepted and finds nothing).
      operationId: updateTransaction
      x-token-access: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionInput'
            example:
              amount: 1400
              type: EXPENSE
              categoryId: cat-groceries
              description: Weekly shop and milk
              date: '2026-10-29'
      responses:
        '200':
          description: The updated transaction.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [transaction]
                properties:
                  transaction:
                    $ref: '#/components/schemas/Transaction'
              example:
                transaction:
                  transactionId: 6f1d2c8e-3b4a-4c5d-8e9f-0a1b2c3d4e5f
                  yearMonth: '2026-10'
                  amount: 1400
                  type: EXPENSE
                  categoryId: cat-groceries
                  description: Weekly shop and milk
                  date: '2026-10-29'
                  createdAt: '2026-10-29T18:30:00.000Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No transaction with this id exists in the path month (`Transaction not found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Transaction not found
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [transactions]
      summary: Delete a transaction
      description: >-
        Moves the transaction to the trash, where `restoreFromTrash` can bring it back for 30 days. In the trash its
        `entityType` is `TRANSACTION` and its `id` is `<yearMonth>#<transactionId>`. Deleting a transaction that does
        not exist still returns 204 and adds nothing to the trash. The path month is checked by shape only (`YYYY-MM`).
      operationId: deleteTransaction
      x-token-access: write
      responses:
        '204':
          description: The transaction is deleted. No body.
        '400':
          description: The path `yearMonth` is not in `YYYY-MM` format (`yearMonth must be in YYYY-MM format`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: yearMonth must be in YYYY-MM format
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/pots:
    get:
      tags: [pots]
      summary: List pots with balances
      description: >-
        Returns one `PotSummary` per pot category: the built-in pots (Holidays, Home maintenance, Gifts, Insurance,
        Emergency fund, Investment) followed by the household's custom pot categories. Archived pots are included and
        carry a non-null `archivedAt`. A pot's balance carries over from month to month and is worked out from its
        transactions (`SET_ASIDE` adds, `TAKE_OUT` and `EXPENSE` subtract; `INCOME` is ignored) and its automatic
        contributions, from the earliest month with any activity up to `asOf`. A pot with no activity has an empty
        `months` list, a zero balance and a zero `thisMonth`. Transactions dated after `asOf` are ignored.
      operationId: listPots
      x-token-access: read
      parameters:
        - name: asOf
          in: query
          required: true
          description: >-
            The month to work out balances for, as `YYYY-MM`. It may be in the past, and at most one month after the
            server's current month (UTC).
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          example: '2026-10'
      responses:
        '200':
          description: The pots (abridged in this example; the real list has one entry for every pot category).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [pots]
                properties:
                  pots:
                    type: array
                    items:
                      $ref: '#/components/schemas/PotSummary'
              example:
                pots:
                  - categoryId: cat-holidays
                    monthlyAmount: 5000
                    goalAmount: 120000
                    autoAmountNow: 5000
                    archivedAt: null
                    balance: 7000
                    thisMonth:
                      setAside: 2000
                      autoAdded: 5000
                      takeOut: 0
                      spent: 0
                    months:
                      - yearMonth: '2026-10'
                        opening: 0
                        setAside: 2000
                        autoAdded: 5000
                        takeOut: 0
                        spent: 0
                        closing: 7000
                  - categoryId: cat-gifts
                    monthlyAmount: null
                    goalAmount: null
                    autoAmountNow: 0
                    archivedAt: null
                    balance: 0
                    thisMonth:
                      setAside: 0
                      autoAdded: 0
                      takeOut: 0
                      spent: 0
                    months: []
        '400':
          description: '`asOf` is missing, not a `YYYY-MM` month, or more than one month ahead (`asOf must be a month in YYYY-MM format, at most one month ahead`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: asOf must be a month in YYYY-MM format, at most one month ahead
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/pots/{categoryId}:
    parameters:
      - $ref: '#/components/parameters/potCategoryId'
    put:
      tags: [pots]
      summary: Set a pot's monthly amount, goal and automatic contribution
      description: >-
        Creates or replaces the pot's settings. All four body fields are required. `monthlyAmount` and `goalAmount`
        are positive integer pence, or `null` for none (omitting them is a 400, not the same as null).
        `autoContribute: true` adds `monthlyAmount` to the pot automatically every month from `month`; it needs a
        non-null `monthlyAmount`. The setting is stored as a history (`autoContribute` in the response): saving removes
        every entry that starts in `month` or later, then adds `{from: month, amount}` only if the amount in force
        before `month` is different (the amount is `monthlyAmount` when on, `0` when off). The history may hold at
        most 120 entries. `month` is the first month the change applies to and must be within one month of the
        server's current month (UTC). An existing `archivedAt` is kept, and saving does not unarchive the pot.
        `categoryId` must be a built-in or custom category of type `POT`. Unknown body fields are ignored. A body that
        is valid JSON but not an object (for example `null`) returns 500, not 400.
      operationId: putPot
      x-token-access: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PotInput'
            examples:
              autoOn:
                summary: Save 50.00 a month towards a 1,200.00 goal
                value:
                  monthlyAmount: 5000
                  goalAmount: 120000
                  autoContribute: true
                  month: '2026-10'
              noAuto:
                summary: No monthly amount, no goal
                value:
                  monthlyAmount: null
                  goalAmount: null
                  autoContribute: false
                  month: '2026-10'
      responses:
        '200':
          description: The stored settings (without storage keys).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [settings]
                properties:
                  settings:
                    $ref: '#/components/schemas/PotSettings'
              example:
                settings:
                  categoryId: cat-holidays
                  monthlyAmount: 5000
                  goalAmount: 120000
                  autoContribute:
                    - from: '2026-10'
                      amount: 5000
                  archivedAt: null
                  updatedAt: '2026-10-30T09:15:00.000Z'
        '400':
          description: >-
            The body is not valid JSON (`Invalid JSON body`); `monthlyAmount` or `goalAmount` is missing or not null or a
            positive integer of at most 1,000,000,000 (`monthlyAmount must be null or a positive integer of pence`, and the
            same for `goalAmount`); `autoContribute` is not a boolean (`autoContribute must be a boolean`); `month` is
            missing, malformed or not within one month of now (`month must be a YYYY-MM month within one month of now`);
            `autoContribute` is true with a null `monthlyAmount` (`autoContribute needs a monthlyAmount`); `categoryId` is
            not a pot category (`categoryId must be an existing pot category`); or the history would exceed 120 entries
            (`Too many auto-contribute changes for this pot`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: autoContribute needs a monthlyAmount
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/pots/{categoryId}/archive:
    parameters:
      - $ref: '#/components/parameters/potCategoryId'
    post:
      tags: [pots]
      summary: Archive a pot
      description: >-
        Retires a pot that is empty. The pot's balance as at `month`, counting only real transactions and the
        automatic contributions made before `month`, must be exactly zero, otherwise the call is a 409 with the
        balance. On success the pot is marked archived (`archivedAt`, kept if it was already archived), automatic
        contributions stop from `month` (history entries that start in `month` or later are removed, so `month` itself
        gets no automatic contribution), the monthly amount and goal are kept, and every recurring reminder in this
        category is moved to the trash (`cancelledRecurring` counts them; `restoreFromTrash` can bring them back for 30
        days). The body must be exactly `{ "month": "YYYY-MM" }` with `month` within one month of the server's current
        month (UTC). Archiving is not atomic: the settings are saved before the reminders are trashed.
      operationId: archivePot
      x-token-access: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PotArchiveInput'
            example:
              month: '2026-10'
      responses:
        '200':
          description: The pot is archived.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [settings, cancelledRecurring]
                properties:
                  settings:
                    $ref: '#/components/schemas/PotSettings'
                  cancelledRecurring:
                    type: integer
                    minimum: 0
                    description: How many recurring reminders in this category were moved to the trash.
              example:
                settings:
                  categoryId: cat-holidays
                  monthlyAmount: 5000
                  goalAmount: 120000
                  autoContribute: []
                  archivedAt: '2026-10-30T09:15:00.000Z'
                  updatedAt: '2026-10-30T09:15:00.000Z'
                cancelledRecurring: 0
        '400':
          description: >-
            The body is not a JSON object of exactly `{ month }`, or `month` is malformed or not within one month of now
            (`Body must be { month } as a YYYY-MM month within one month of now`); or `categoryId` is not a pot category
            (`categoryId must be an existing pot category`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Body must be { month } as a YYYY-MM month within one month of now
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: The pot still holds money (or is overdrawn). Nothing was changed.
          content:
            application/json:
              schema:
                type: object
                required: [error, balance]
                additionalProperties: false
                properties:
                  error:
                    type: string
                  balance:
                    type: integer
                    description: The non-zero balance in pence as at `month`; negative when overdrawn.
              example:
                error: Take the balance out of this pot before archiving it
                balance: 2000
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/pots/{categoryId}/unarchive:
    parameters:
      - $ref: '#/components/parameters/potCategoryId'
    post:
      tags: [pots]
      summary: Unarchive a pot
      description: >-
        Clears `archivedAt`. The request needs no body, and any body is ignored. Nothing else is restored: the
        automatic contribution stays stopped (turn it on again with `putPot`) and reminders trashed by archiving stay in
        the trash. Unarchiving a pot that is not archived succeeds and just refreshes `updatedAt`; for a pot with no
        stored settings it creates them with no monthly amount or goal.
      operationId: unarchivePot
      x-token-access: write
      responses:
        '200':
          description: The pot's settings with `archivedAt` cleared.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [settings]
                properties:
                  settings:
                    $ref: '#/components/schemas/PotSettings'
              example:
                settings:
                  categoryId: cat-holidays
                  monthlyAmount: 5000
                  goalAmount: 120000
                  autoContribute: []
                  archivedAt: null
                  updatedAt: '2026-10-30T09:20:00.000Z'
        '400':
          description: '`categoryId` is not a pot category (`categoryId must be an existing pot category`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: categoryId must be an existing pot category
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/recurring:
    get:
      tags: [recurring]
      summary: List recurring reminders
      description: >-
        Returns every recurring reminder, mapped (no storage keys), in id order. A reminder stored before `frequency`
        existed reads as `MONTHLY`.
      operationId: listRecurring
      x-token-access: read
      responses:
        '200':
          description: All recurring reminders.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [recurring]
                properties:
                  recurring:
                    type: array
                    items:
                      $ref: '#/components/schemas/Recurring'
              example:
                recurring:
                  - recurringId: 8a7e3c1d-5b2f-4e60-9d14-7c2b1a0f3e55
                    type: EXPENSE
                    categoryId: cat-mortgage
                    amount: 90000
                    description: Mortgage
                    dayOfMonth: 1
                    frequency: MONTHLY
                    anchorDate: null
                    leadDays: 3
                    handledPeriod: null
                    createdAt: '2026-10-30T09:15:00.000Z'
                    updatedAt: '2026-10-30T09:15:00.000Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [recurring]
      summary: Add a recurring reminder
      description: >-
        Creates a reminder with a server-generated UUID id and `handledPeriod: null`. A monthly reminder
        (`frequency` `MONTHLY`, which is also the default when `frequency` is omitted or null) needs `dayOfMonth`
        and ignores `anchorDate`. Every other frequency needs a real `anchorDate`, ignores any `dayOfMonth` in the body
        and stores `dayOfMonth` as the day of the anchor date. `leadDays` (how many days before the due date the
        reminder starts) defaults to 3 and may be at most 14 for `WEEKLY` and `FOUR_WEEKLY`, 30 for `MONTHLY` and 60
        for `QUARTERLY` and `YEARLY`. `description` is trimmed after its 200-character limit is checked. The
        `categoryId` is not checked against existing categories. Unknown fields are ignored.
      operationId: createRecurring
      x-token-access: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecurringInput'
            examples:
              monthly:
                summary: A monthly bill on the 1st
                value:
                  type: EXPENSE
                  categoryId: cat-mortgage
                  amount: 90000
                  description: Mortgage
                  frequency: MONTHLY
                  dayOfMonth: 1
              weekly:
                summary: A weekly payment counted from a date
                value:
                  type: EXPENSE
                  categoryId: cat-personal-spending
                  amount: 2500
                  description: Cleaner
                  frequency: WEEKLY
                  anchorDate: '2026-11-02'
                  leadDays: 2
      responses:
        '201':
          description: The reminder was created.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [recurring]
                properties:
                  recurring:
                    $ref: '#/components/schemas/Recurring'
              example:
                recurring:
                  recurringId: 8a7e3c1d-5b2f-4e60-9d14-7c2b1a0f3e55
                  type: EXPENSE
                  categoryId: cat-mortgage
                  amount: 90000
                  description: Mortgage
                  dayOfMonth: 1
                  frequency: MONTHLY
                  anchorDate: null
                  leadDays: 3
                  handledPeriod: null
                  createdAt: '2026-10-30T09:15:00.000Z'
                  updatedAt: '2026-10-30T09:15:00.000Z'
        '400':
          description: >-
            The body is not a JSON object (`Invalid JSON body`) or a field breaks a rule. The messages are
            `amount must be a positive integer representing pence/cents, at most 1000000000`,
            `type must be EXPENSE, INCOME, SET_ASIDE, or TAKE_OUT`, `categoryId is required` (missing, empty or over 100
            characters), `description must be a string of at most 200 characters`,
            `frequency must be one of WEEKLY, FOUR_WEEKLY, MONTHLY, QUARTERLY, YEARLY`,
            `leadDays must be an integer from 0 to <max> for <FREQUENCY> items`,
            `dayOfMonth must be an integer from 1 to 31` (monthly) and
            `anchorDate must be a valid YYYY-MM-DD date for <FREQUENCY> items` (other frequencies; `2026-02-30` is not
            valid). The first rule broken, in that order, is reported.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: dayOfMonth must be an integer from 1 to 31
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/recurring/{recurringId}:
    parameters:
      - $ref: '#/components/parameters/recurringId'
    put:
      tags: [recurring]
      summary: Replace a recurring reminder
      description: >-
        Replaces the editable fields of an existing reminder; the body and its rules are the same as for
        `createRecurring`, so it is a full replacement: an omitted `frequency` becomes `MONTHLY`, an omitted
        `description` becomes empty and an omitted `leadDays` goes back to 3. `recurringId`, `createdAt` and
        `handledPeriod` are kept, even when the frequency changes, so after changing between monthly and another
        frequency `handledPeriod` may still be in the old key format; clear it with `setRecurringHandled`.
      operationId: updateRecurring
      x-token-access: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecurringInput'
            example:
              type: EXPENSE
              categoryId: cat-mortgage
              amount: 95000
              description: Mortgage
              frequency: MONTHLY
              dayOfMonth: 1
              leadDays: 5
      responses:
        '200':
          description: The updated reminder.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [recurring]
                properties:
                  recurring:
                    $ref: '#/components/schemas/Recurring'
              example:
                recurring:
                  recurringId: 8a7e3c1d-5b2f-4e60-9d14-7c2b1a0f3e55
                  type: EXPENSE
                  categoryId: cat-mortgage
                  amount: 95000
                  description: Mortgage
                  dayOfMonth: 1
                  frequency: MONTHLY
                  anchorDate: null
                  leadDays: 5
                  handledPeriod: null
                  createdAt: '2026-10-30T09:15:00.000Z'
                  updatedAt: '2026-10-30T09:25:00.000Z'
        '400':
          description: The body is not a JSON object (`Invalid JSON body`) or breaks a rule listed under `createRecurring`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Invalid JSON body
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No reminder has this id (`Recurring item not found`). The body is validated first, so an invalid body is a 400 even for an unknown id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Recurring item not found
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [recurring]
      summary: Delete a recurring reminder
      description: >-
        Moves the reminder to the trash, where `restoreFromTrash` can bring it back for 30 days (`entityType`
        `RECURRING`, `id` the reminder's id). Deleting a reminder that does not exist still returns 204 and adds nothing
        to the trash. Transactions made from the reminder keep their `recurringId`.
      operationId: deleteRecurring
      x-token-access: write
      responses:
        '204':
          description: The reminder is deleted. No body.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/recurring/{recurringId}/handled:
    parameters:
      - $ref: '#/components/parameters/recurringId'
    post:
      tags: [recurring]
      summary: Mark a reminder handled, or clear the mark
      description: >-
        Records the latest occurrence that has been dealt with, so the reminder stops showing for it. `period` is
        `YYYY-MM` for a monthly reminder and the occurrence date `YYYY-MM-DD` (a real calendar date) for the other
        frequencies, or `null` to clear the mark. The key is validated for shape only: it is not checked against the
        reminder's frequency, and either format is accepted for any reminder. The field is required (an empty object is
        a 400). Only `handledPeriod` and `updatedAt` change.
      operationId: setRecurringHandled
      x-token-access: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecurringHandledInput'
            examples:
              month:
                summary: A monthly reminder handled for October
                value:
                  period: '2026-10'
              occurrence:
                summary: A weekly reminder handled for one date
                value:
                  period: '2026-11-02'
              clear:
                summary: Clear the mark
                value:
                  period: null
      responses:
        '200':
          description: The updated reminder.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [recurring]
                properties:
                  recurring:
                    $ref: '#/components/schemas/Recurring'
              example:
                recurring:
                  recurringId: 8a7e3c1d-5b2f-4e60-9d14-7c2b1a0f3e55
                  type: EXPENSE
                  categoryId: cat-mortgage
                  amount: 95000
                  description: Mortgage
                  dayOfMonth: 1
                  frequency: MONTHLY
                  anchorDate: null
                  leadDays: 5
                  handledPeriod: '2026-10'
                  createdAt: '2026-10-30T09:15:00.000Z'
                  updatedAt: '2026-10-30T09:30:00.000Z'
        '400':
          description: >-
            The body is not a JSON object (`Invalid JSON body`), or `period` is missing or is not `YYYY-MM`, a real
            `YYYY-MM-DD` date or null (`period must be YYYY-MM, YYYY-MM-DD or null`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: period must be YYYY-MM, YYYY-MM-DD or null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No reminder has this id (`Recurring item not found`). The body is validated first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Recurring item not found
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/trash:
    get:
      tags: [trash]
      summary: List recently deleted items
      description: >-
        Returns the deleted transactions, budgets (targets), recurring reminders and accounts that can still be
        restored, newest deletion first. An item stays for 30 days after deletion; expired items are not listed and
        cannot be restored. Items are added by deleting a transaction, budget, reminder or account, and by archiving a
        pot, which trashes that category's recurring reminders. Deleted categories are not kept.
      operationId: listTrash
      x-token-access: read
      responses:
        '200':
          description: The restorable items.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/TrashItem'
              example:
                items:
                  - entityType: TRANSACTION
                    id: '2026-10#6f1d2c8e-3b4a-4c5d-8e9f-0a1b2c3d4e5f'
                    item:
                      transactionId: 6f1d2c8e-3b4a-4c5d-8e9f-0a1b2c3d4e5f
                      yearMonth: '2026-10'
                      amount: 1250
                      type: EXPENSE
                      categoryId: cat-groceries
                      description: Weekly shop
                      date: '2026-10-29'
                      createdAt: '2026-10-29T18:30:00.000Z'
                    deletedAt: '2026-10-30T09:15:00.000Z'
                    expiresAt: 1795943700
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/trash/restore:
    post:
      tags: [trash]
      summary: Restore a deleted item
      description: >-
        Puts a trashed item back exactly as it was stored and removes it from the trash. Only `entityType` and `id`
        are accepted; any other field is a 400. The item is restored under its original key, so it is not restored if
        something now occupies that key.
      operationId: restoreFromTrash
      x-token-access: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreInput'
            example:
              entityType: TRANSACTION
              id: '2026-10#6f1d2c8e-3b4a-4c5d-8e9f-0a1b2c3d4e5f'
      responses:
        '200':
          description: The item was restored.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [entityType, id, item]
                properties:
                  entityType:
                    $ref: '#/components/schemas/TrashEntityType'
                  id:
                    type: string
                  item:
                    type: object
                    description: The restored record, without storage keys. Same shape as `item` in `listTrash`.
                    additionalProperties: true
              example:
                entityType: TRANSACTION
                id: '2026-10#6f1d2c8e-3b4a-4c5d-8e9f-0a1b2c3d4e5f'
                item:
                  transactionId: 6f1d2c8e-3b4a-4c5d-8e9f-0a1b2c3d4e5f
                  yearMonth: '2026-10'
                  amount: 1250
                  type: EXPENSE
                  categoryId: cat-groceries
                  description: Weekly shop
                  date: '2026-10-29'
                  createdAt: '2026-10-29T18:30:00.000Z'
        '400':
          description: >-
            The body is not a JSON object (`Invalid JSON body`), has a field other than `entityType` and `id`
            (`Only entityType and id are allowed`), has a missing or unknown `entityType`
            (`entityType must be one of TRANSACTION, TARGET, RECURRING, ACCOUNT`), or has a missing or malformed `id`
            (`id is missing or not in the expected format`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Only entityType and id are allowed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Nothing with this type and id is in the trash, or it has expired or was just restored by another request (`This item is no longer in Recently deleted`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: This item is no longer in Recently deleted
        '409':
          description: A record already exists at the original key, so nothing was restored and the item stays in the trash (`This item is already in place, so it was not restored`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: This item is already in place, so it was not restored
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      description: >-
        An Auth0 JWT (Auth0 mode) or a personal API token starting `hwr_` (read) or `hww_` (read-write). Tokens are
        limited as described in the API overview.
    sessionCookie:
      type: apiKey
      in: cookie
      name: hoardwise_session
      description: >-
        The session cookie set by the built-in login (local mode). Over HTTPS it is named
        `__Host-hoardwise_session`.
  parameters:
    yearMonth:
      name: yearMonth
      in: path
      required: true
      description: The month a transaction belongs to, as `YYYY-MM`. Only the shape is checked, so `2026-13` is accepted and matches nothing.
      schema:
        type: string
        pattern: '^\d{4}-\d{2}$'
        examples: ['2026-10']
    categoryId:
      name: categoryId
      in: path
      required: true
      description: The id of a category.
      schema:
        type: string
    transactionId:
      name: transactionId
      in: path
      required: true
      description: The id of a transaction.
      schema:
        type: string
        examples: ['6f1d2c8e-3b4a-4c5d-8e9f-0a1b2c3d4e5f']
    potCategoryId:
      name: categoryId
      in: path
      required: true
      description: The id of a pot category, built-in (such as `cat-holidays`) or custom.
      schema:
        type: string
        examples: [cat-holidays]
    recurringId:
      name: recurringId
      in: path
      required: true
      description: The id of a recurring reminder.
      schema:
        type: string
        examples: ['8a7e3c1d-5b2f-4e60-9d14-7c2b1a0f3e55']
    accountId:
      name: accountId
      in: path
      required: true
      description: The id of an account.
      schema:
        type: string
    tokenId:
      name: tokenId
      in: path
      required: true
      description: The id of an access token.
      schema:
        type: string
  responses:
    ValidationError:
      description: The request was invalid. The message says which field or rule.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Invalid JSON body
    Unauthorized:
      description: The credential is missing, invalid, expired or revoked.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Unauthorized
    Forbidden:
      description: >-
        The credential is valid but may not do this: a read token on a write method, a token on a route tokens cannot
        use, a cross-origin cookie request, or a protected default category.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: This token is read-only
    NotFound:
      description: No such route or record.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Endpoint not found
    Conflict:
      description: The request conflicts with the current state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: This item is already in place, so it was not restored
    TooManyRequests:
      description: Too many requests. Wait for the number of seconds in `Retry-After`.
      headers:
        Retry-After:
          description: Seconds to wait before trying again.
          schema:
            type: integer
            minimum: 1
          example: 60
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Too many requests
    InternalError:
      description: An unexpected failure. The message is generic; the detail is in the server logs only.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Internal server error
  schemas:
    Error:
      type: object
      description: The body of every error response. Some errors add fields, for example `retryAfter` on a 429.
      required: [error]
      properties:
        error:
          type: string
          description: A short message that is safe to show to the user.
      additionalProperties: true
    CategoryType:
      type: string
      enum: [EXPENSE, INCOME, POT]
    CategoryGroup:
      type: string
      enum: [BILLS, SINKING_FUNDS, EVERYDAY, SAVING_INVESTMENT]
    Category:
      type: object
      additionalProperties: false
      required: [categoryId, name, type, icon, isDefault, createdAt]
      properties:
        categoryId:
          type: string
          description: A fixed id such as `cat-groceries` for a default category, a UUID for a custom one.
        name:
          type: string
        type:
          $ref: '#/components/schemas/CategoryType'
        icon:
          type: string
          description: An emoji or an icon name. `default` when none was given.
        group:
          $ref: '#/components/schemas/CategoryGroup'
          description: Absent for `INCOME` categories.
        isDefault:
          type: boolean
          description: True for the built-in categories, which cannot be renamed or deleted.
        createdAt:
          type: string
          description: ISO 8601 timestamp; the built-in categories share one fixed date.
        archived:
          type: boolean
          description: Present and true only for an archived pot category.
    CategoryInput:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
          description: Trimmed, then 1 to 50 characters.
        type:
          $ref: '#/components/schemas/CategoryType'
        icon:
          type: string
          description: An emoji or icon name, cut to 50 characters. A non-string is ignored and `default` is stored.
        group:
          $ref: '#/components/schemas/CategoryGroup'
          description: >-
            Not allowed for `INCOME`. A `POT` must use `SINKING_FUNDS` or `SAVING_INVESTMENT`; an `EXPENSE` must use
            `BILLS` or `EVERYDAY`.
    CategoryRenameInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
          description: Trimmed, then 1 to 50 characters.
    ReassignInput:
      type: object
      required: [toCategoryId]
      properties:
        toCategoryId:
          type: string
          minLength: 1
          description: The category to move records to. It must exist and differ from the path `categoryId`.
    TargetPeriod:
      type: string
      enum: [MONTHLY, WEEKLY]
    Target:
      type: object
      additionalProperties: false
      required: [categoryId, targetAmount, period, updatedAt]
      properties:
        categoryId:
          type: string
        targetAmount:
          type: integer
          minimum: 1
          maximum: 1000000000
          description: The budget in pence (or cents).
        period:
          $ref: '#/components/schemas/TargetPeriod'
        updatedAt:
          type: string
          format: date-time
    StoredTarget:
      type: object
      additionalProperties: false
      description: A target as listed by `listTargets`, including its storage keys.
      required: [PK, SK, categoryId, targetAmount, period, updatedAt]
      properties:
        PK:
          type: string
        SK:
          type: string
        categoryId:
          type: string
        targetAmount:
          type: integer
          minimum: 1
          maximum: 1000000000
        period:
          $ref: '#/components/schemas/TargetPeriod'
        updatedAt:
          type: string
          format: date-time
    TargetInput:
      type: object
      required: [targetAmount, period]
      properties:
        targetAmount:
          type: integer
          minimum: 1
          maximum: 1000000000
          description: Positive integer pence (or cents).
        period:
          $ref: '#/components/schemas/TargetPeriod'
    TransactionType:
      type: string
      description: >-
        What kind of movement this is. `EXPENSE` is Spend, `INCOME` is Income, `SET_ASIDE` is Add to pot and
        `TAKE_OUT` is Take from pot.
      enum: [EXPENSE, INCOME, SET_ASIDE, TAKE_OUT]
    Transaction:
      type: object
      additionalProperties: false
      required: [transactionId, yearMonth, amount, type, categoryId, description, date, createdAt]
      properties:
        transactionId:
          type: string
          description: A UUID.
        yearMonth:
          type: string
          pattern: '^\d{4}-\d{2}$'
          description: The month, `YYYY-MM`. Always equal to the first 7 characters of `date`.
        amount:
          type: integer
          minimum: 1
          maximum: 1000000000
          description: Integer pence (or cents).
        type:
          $ref: '#/components/schemas/TransactionType'
        categoryId:
          type: string
        description:
          type: string
          maxLength: 200
          description: Trimmed. An empty string when none was given.
        date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: The day, `YYYY-MM-DD`.
        createdAt:
          type: string
          format: date-time
        recurringId:
          type: string
          description: The recurring reminder this transaction was made from. Present only when linked.
    StoredTransaction:
      type: object
      additionalProperties: false
      description: A transaction as listed by `listTransactions` and `listTransactionsRange`, including its storage keys.
      required: [PK, SK, transactionId, yearMonth, amount, type, categoryId, description, date, createdAt]
      properties:
        PK:
          type: string
          description: '`USER#<id>`.'
        SK:
          type: string
          description: '`TXN#<yearMonth>#<transactionId>`.'
        transactionId:
          type: string
        yearMonth:
          type: string
          pattern: '^\d{4}-\d{2}$'
        amount:
          type: integer
          minimum: 1
          maximum: 1000000000
        type:
          $ref: '#/components/schemas/TransactionType'
        categoryId:
          type: string
        description:
          type: string
          maxLength: 200
        date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        createdAt:
          type: string
          format: date-time
        recurringId:
          type: string
    TransactionInput:
      type: object
      required: [amount, type, categoryId, date]
      properties:
        transactionId:
          type: string
          pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
          description: Create only, a client-chosen UUID. Ignored when updating.
        amount:
          type: integer
          minimum: 1
          maximum: 1000000000
          description: Positive integer pence (or cents).
        type:
          $ref: '#/components/schemas/TransactionType'
        categoryId:
          type: string
          minLength: 1
          maxLength: 100
          description: Not checked against existing categories.
        description:
          type: [string, 'null']
          maxLength: 200
          description: Optional, at most 200 characters before trimming. Null or omitted is stored as an empty string.
        date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: '`YYYY-MM-DD`. Only the shape is checked.'
        recurringId:
          type: string
          maxLength: 100
          pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
          description: Links the transaction to a recurring reminder (a UUID). Not checked against existing reminders.
    PotAutoEntry:
      type: object
      additionalProperties: false
      description: One step in a pot's automatic contribution history.
      required: [from, amount]
      properties:
        from:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          description: The first month the amount applies to, `YYYY-MM`. It applies until the next entry's month.
        amount:
          type: integer
          minimum: 0
          maximum: 1000000000
          description: Pence added to the pot each month. `0` means automatic contributions are off.
    PotSettings:
      type: object
      additionalProperties: false
      description: A pot's stored settings, without storage keys.
      required: [categoryId, monthlyAmount, goalAmount, autoContribute, archivedAt, updatedAt]
      properties:
        categoryId:
          type: string
        monthlyAmount:
          type: [integer, 'null']
          minimum: 1
          maximum: 1000000000
          description: Pence the household plans to put in each month. Null means no plan.
        goalAmount:
          type: [integer, 'null']
          minimum: 1
          maximum: 1000000000
          description: Pence the pot is saving towards. Null means no goal.
        autoContribute:
          type: array
          maxItems: 120
          description: The history of automatic contributions, oldest first. Empty when never turned on.
          items:
            $ref: '#/components/schemas/PotAutoEntry'
        archivedAt:
          type: [string, 'null']
          format: date-time
          description: When the pot was archived. Null for an active pot.
        updatedAt:
          type: string
          format: date-time
    PotInput:
      type: object
      required: [monthlyAmount, goalAmount, autoContribute, month]
      properties:
        monthlyAmount:
          type: [integer, 'null']
          minimum: 1
          maximum: 1000000000
          description: Positive integer pence, or null for none. Required, but may be null.
        goalAmount:
          type: [integer, 'null']
          minimum: 1
          maximum: 1000000000
          description: Positive integer pence, or null for no goal. Required, but may be null.
        autoContribute:
          type: boolean
          description: Add `monthlyAmount` to the pot automatically every month from `month`. Needs a non-null `monthlyAmount`.
        month:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          description: >-
            The first month the automatic contribution change applies to, `YYYY-MM`. Within one month either side of the
            server's current month (UTC).
    PotArchiveInput:
      type: object
      additionalProperties: false
      required: [month]
      properties:
        month:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          description: The month the pot is emptied by, `YYYY-MM`. Within one month either side of the server's current month (UTC).
    PotMonth:
      type: object
      additionalProperties: false
      description: One month of a pot's history. All amounts are integer pence.
      required: [yearMonth, opening, setAside, autoAdded, takeOut, spent, closing]
      properties:
        yearMonth:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
        opening:
          type: integer
          description: The balance carried in from the previous month (0 for the first month).
        setAside:
          type: integer
          minimum: 0
          description: Total of `SET_ASIDE` (Add to pot) transactions in the month.
        autoAdded:
          type: integer
          minimum: 0
          description: The automatic contribution for the month.
        takeOut:
          type: integer
          minimum: 0
          description: Total of `TAKE_OUT` (Take from pot) transactions in the month.
        spent:
          type: integer
          minimum: 0
          description: Total of `EXPENSE` (Spend) transactions in the month.
        closing:
          type: integer
          description: '`opening + setAside + autoAdded - takeOut - spent`. Can be negative when overdrawn.'
    PotSummary:
      type: object
      additionalProperties: false
      description: A pot with its settings and monthly history up to the requested month. All amounts are integer pence.
      required: [categoryId, monthlyAmount, goalAmount, autoAmountNow, archivedAt, balance, thisMonth, months]
      properties:
        categoryId:
          type: string
        monthlyAmount:
          type: [integer, 'null']
          description: The planned monthly amount from the settings; null when never set or cleared.
        goalAmount:
          type: [integer, 'null']
          description: The goal from the settings; null when never set or cleared.
        autoAmountNow:
          type: integer
          minimum: 0
          description: The automatic contribution in force in the `asOf` month. 0 when off.
        archivedAt:
          type: [string, 'null']
          format: date-time
        balance:
          type: integer
          description: The closing balance of the `asOf` month. 0 when the pot has no activity. Negative when overdrawn.
        thisMonth:
          type: object
          additionalProperties: false
          description: The movements in the `asOf` month (all zero when the pot has no activity).
          required: [setAside, autoAdded, takeOut, spent]
          properties:
            setAside:
              type: integer
              minimum: 0
            autoAdded:
              type: integer
              minimum: 0
            takeOut:
              type: integer
              minimum: 0
            spent:
              type: integer
              minimum: 0
        months:
          type: array
          description: >-
            Every month from the pot's first activity (a transaction, or the start of an automatic contribution) up to and
            including `asOf`, oldest first, with no gaps. Empty when the pot has no activity.
          items:
            $ref: '#/components/schemas/PotMonth'
    RecurringFrequency:
      type: string
      description: >-
        How often the reminder repeats. `WEEKLY` every 7 days and `FOUR_WEEKLY` every 28 days, both counted from
        `anchorDate`; `MONTHLY` on `dayOfMonth`; `QUARTERLY` every three months and `YEARLY` every year, both
        counted from `anchorDate`.
      enum: [WEEKLY, FOUR_WEEKLY, MONTHLY, QUARTERLY, YEARLY]
    Recurring:
      type: object
      additionalProperties: false
      description: A reminder for a bill or income that repeats. Responses never include storage keys.
      required:
        - recurringId
        - type
        - categoryId
        - amount
        - description
        - dayOfMonth
        - frequency
        - anchorDate
        - leadDays
        - handledPeriod
        - createdAt
        - updatedAt
      properties:
        recurringId:
          type: string
          description: A UUID.
        type:
          $ref: '#/components/schemas/TransactionType'
        categoryId:
          type: string
        amount:
          type: integer
          minimum: 1
          maximum: 1000000000
          description: Integer pence (or cents).
        description:
          type: string
          maxLength: 200
          description: Trimmed. An empty string when none was given.
        dayOfMonth:
          type: integer
          minimum: 1
          maximum: 31
          description: For `MONTHLY`, the day it falls due. For the other frequencies, the day of the month of `anchorDate`.
        frequency:
          $ref: '#/components/schemas/RecurringFrequency'
        anchorDate:
          type: [string, 'null']
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: The date a non-monthly schedule is counted from, `YYYY-MM-DD`. Null for `MONTHLY`.
        leadDays:
          type: integer
          minimum: 0
          maximum: 60
          description: >-
            How many days before the due date the reminder starts showing. At most 14 for `WEEKLY` and `FOUR_WEEKLY`, 30
            for `MONTHLY` and 60 for `QUARTERLY` and `YEARLY`.
        handledPeriod:
          type: [string, 'null']
          pattern: '^\d{4}-\d{2}(-\d{2})?$'
          description: >-
            The latest occurrence marked handled. By convention `YYYY-MM` for a monthly reminder and the occurrence date
            `YYYY-MM-DD` for the others; null when none. The server accepts either format for any frequency.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RecurringInput:
      type: object
      required: [type, categoryId, amount]
      description: >-
        `dayOfMonth` is required when `frequency` is `MONTHLY` or omitted; `anchorDate` is required for every other
        frequency.
      properties:
        type:
          $ref: '#/components/schemas/TransactionType'
        categoryId:
          type: string
          minLength: 1
          maxLength: 100
          description: Not checked against existing categories.
        amount:
          type: integer
          minimum: 1
          maximum: 1000000000
          description: Positive integer pence (or cents).
        description:
          type: [string, 'null']
          maxLength: 200
          description: Optional, at most 200 characters before trimming. Null or omitted is stored as an empty string.
        frequency:
          description: Defaults to `MONTHLY` when omitted or null.
          anyOf:
            - $ref: '#/components/schemas/RecurringFrequency'
            - type: 'null'
        dayOfMonth:
          type: integer
          minimum: 1
          maximum: 31
          description: Required for `MONTHLY`. Ignored for the other frequencies.
        anchorDate:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Required for the non-monthly frequencies, a real calendar date. Ignored for `MONTHLY`.
        leadDays:
          type: [integer, 'null']
          minimum: 0
          maximum: 60
          description: Defaults to 3 when omitted or null. The maximum depends on `frequency` (see `Recurring`).
    RecurringHandledInput:
      type: object
      required: [period]
      properties:
        period:
          type: [string, 'null']
          pattern: '^\d{4}-\d{2}(-\d{2})?$'
          description: >-
            `YYYY-MM` (for monthly reminders), a real `YYYY-MM-DD` date (for the others) or null to clear. Required, but
            may be null.
    TrashEntityType:
      type: string
      description: >-
        What was deleted. `TRANSACTION` is a transaction, `TARGET` a budget, `RECURRING` a recurring reminder and
        `ACCOUNT` an account.
      enum: [TRANSACTION, TARGET, RECURRING, ACCOUNT]
    TrashItem:
      type: object
      additionalProperties: false
      required: [entityType, id, item, deletedAt, expiresAt]
      properties:
        entityType:
          $ref: '#/components/schemas/TrashEntityType'
        id:
          type: string
          description: >-
            The id to send to `restoreFromTrash`. For `TRANSACTION` it is `<yearMonth>#<transactionId>`; for the other
            types it is the target's category id, the recurring id or the account id.
        item:
          type: object
          additionalProperties: true
          description: >-
            The deleted record as it was stored, without storage keys: a `Transaction`, a target, a recurring reminder
            or an account, according to `entityType`.
        deletedAt:
          type: string
          format: date-time
        expiresAt:
          type: integer
          description: When the item stops being restorable, in Unix seconds (30 days after `deletedAt`).
    RestoreInput:
      type: object
      additionalProperties: false
      required: [entityType, id]
      properties:
        entityType:
          $ref: '#/components/schemas/TrashEntityType'
        id:
          type: string
          description: >-
            The `id` from `listTrash`. For `TRANSACTION`, `YYYY-MM#<transactionId>`; otherwise 1 to 100 letters, digits,
            `_` or `-`. The transaction id part has the same character rules.
